<html lang="bn">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg-deep:#12102B;
    --bg-panel:#1B1840;
    --gold:#E8B444;
    --teal:#2BD9C9;
    --pink:#FF6F91;
    --ink:#F4F1FA;
    --ink-dim:#9A96C4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #2A2564 0%, transparent 55%),
      var(--bg-deep);
    font-family:'Hind Siliguri','Poppins',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 16px 100px;
    overflow-x:hidden;
  }
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

  .eyebrow{
    font-family:'Poppins',sans-serif;
    font-size:11px;
    letter-spacing:3px;
    color:var(--teal);
    text-transform:uppercase;
    margin-top:6px;
  }
  h1{
    font-family:'Hind Siliguri',sans-serif;
    font-weight:700;
    font-size:24px;
    margin:4px 0 2px;
    text-align:center;
  }
  .balance-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin:6px 0 22px;
  }
  .balance-num{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:34px;
    color:var(--gold);
  }
  .balance-label{ color:var(--ink-dim); font-size:13px; }

  .streak-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,111,145,.12);
    border:1px solid rgba(255,111,145,.35);
    color:var(--pink);
    font-size:12px;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    margin-top:4px;
  }

  .goal-wrap{
    width:100%;
    max-width:260px;
    margin:14px 0 4px;
  }
  .goal-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .goal-track{
    width:100%;
    height:10px;
    background:var(--bg-panel);
    border-radius:999px;
    overflow:hidden;
  }
  .goal-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--gold));
    border-radius:999px;
    transition:width .5s ease;
    width:0%;
  }

  .badge-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:2px 0 10px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .badge-pill{
    font-size:12px;
    font-weight:600;
    color:var(--bg-deep);
    background:var(--gold);
    padding:4px 10px;
    border-radius:999px;
  }

  .social-proof{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:18px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .social-proof .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 6px #4ADE80;
  }

  .wheel-wrap{
    position:relative;
    width:280px;
    height:280px;
    margin:10px auto 18px;
  }
  .wheel-glow{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,180,68,.35) 0%, transparent 70%);
    animation:breathe 2.4s ease-in-out infinite;
    z-index:0;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(0.94); opacity:.6; }
    50%{ transform:scale(1.06); opacity:1; }
  }
  .sparkle{
    position:absolute;
    font-size:16px;
    animation:twinkle 1.8s ease-in-out infinite;
    z-index:6;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.2; transform:scale(.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  .pointer{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--pink);
    z-index:5;
    filter:drop-shadow(0 0 8px rgba(255,111,145,.9));
  }
  #wheel{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    display:block;
    box-shadow:0 0 0 6px var(--bg-panel), 0 0 0 8px rgba(232,180,68,.5), 0 0 50px rgba(232,180,68,.35);
    transition:transform 4.5s cubic-bezier(.13,.87,.03,1);
    z-index:1;
  }
  .hub{
    position:absolute;
    top:50%;left:50%;
    width:60px;height:60px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, var(--bg-panel) 60%, #14123A);
    border:3px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    z-index:4;
    box-shadow:0 0 14px rgba(232,180,68,.6);
  }

  .spin-btn{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.5px;
    color:#1B1840;
    background:linear-gradient(135deg,var(--gold),#F6D186);
    border:none;
    border-radius:16px;
    padding:15px 46px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(232,180,68,.35);
    transition:transform .15s ease, opacity .2s ease;
  }
  .spin-btn:active{ transform:scale(.96); }
  .spin-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
  }

  .timer{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
    min-height:18px;
  }

  .ad-btn{
    margin-top:16px;
    font-family:'Hind Siliguri',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--teal);
    background:rgba(43,217,201,.1);
    border:1px solid rgba(43,217,201,.4);
    border-radius:12px;
    padding:10px 20px;
    cursor:pointer;
  }

  .history{
    width:100%;
    max-width:340px;
    margin-top:22px;
  }
  .history h3{
    font-size:13px;
    color:var(--ink-dim);
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:8px 12px;
    background:var(--bg-panel);
    border-radius:10px;
    margin-bottom:6px;
  }
  .history-item span:last-child{ color:var(--gold); font-weight:600; }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--bg-panel);
    border:1px solid var(--gold);
    color:var(--ink);
    padding:12px 22px;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:50;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .confetti-piece{
    position:fixed;
    top:45%;
    left:50%;
    font-size:20px;
    pointer-events:none;
    z-index:60;
    animation:confetti-burst 1.1s ease-out forwards;
  }
  @keyframes confetti-burst{
    0%{ transform:translate(-50%,-50%) scale(0.4) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); opacity:0; }
  }
</style>
</head>
<body>

  <div class="eyebrow">DAILY SPIN &amp; EARN</div>
  <h1>প্রতিদিন ঘোরান, পয়েন্ট জিতুন</h1>
  <div class="streak-badge" id="streakBadge">🔥 ০ দিন স্ট্রিক</div>
  <div class="balance-row">
    <span class="balance-num" id="balanceNum">0</span>
    <span class="balance-label">পয়েন্ট</span>
  </div>

  <div class="goal-wrap">
    <div class="goal-label"><span>আজকের লক্ষ্য</span><span id="goalText">0 / 100</span></div>
    <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
  </div>

  <div class="badge-row">
    <span class="badge-pill" id="badgePill">🎯 নতুন স্পিনার</span>
    <span id="nextBadgeText"></span>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-glow"></div>
    <span class="sparkle" style="top:-6px; left:6px; animation-delay:0s;">✨</span>
    <span class="sparkle" style="top:10px; right:-8px; animation-delay:.4s;">⭐</span>
    <span class="sparkle" style="bottom:0px; left:-10px; animation-delay:.8s;">✨</span>
    <span class="sparkle" style="bottom:-6px; right:12px; animation-delay:1.2s;">💫</span>
    <div class="pointer"></div>
    <svg id="wheel" viewBox="0 0 200 200"></svg>
    <div class="hub">🎰</div>
  </div>

  <button class="spin-btn" id="spinBtn">ঘোরান</button>
  <div class="timer" id="timerText"></div>

  <button class="ad-btn" id="adBtn">📺 বিজ্ঞাপন দেখে এক্সট্রা স্পিন নিন</button>

  <div class="social-proof"><span class="dot"></span><span id="socialProofText">আজ অনেকেই স্পিন করছেন</span></div>

  <div class="history">
    <h3>সাম্প্রতিক ইতিহাস</h3>
    <div id="historyList"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ---------- Telegram init ----------
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
                  ? String(tg.initDataUnsafe.user.id)
                  : 'guest';

  // ---------- Storage keys (per user) ----------
  const K_BAL = 'spin_balance_' + userId;
  const K_LAST = 'spin_last_' + userId;
  const K_HIST = 'spin_history_' + userId;
  const K_STREAK = 'spin_streak_' + userId;
  const K_STREAK_DATE = 'spin_streak_date_' + userId; // যে তারিখ পর্যন্ত স্ট্রিক গোনা হয়েছে
  const K_DAILY_PTS = 'daily_pts_' + userId;
  const K_DAILY_DATE = 'daily_pts_date_' + userId;
  const K_LIFETIME = 'lifetime_pts_' + userId;
  const DAILY_GOAL = 100;
  const SPIN_COOLDOWN_MS = 24 * 60 * 60 * 1000; // ২৪ ঘণ্টা

  const MILESTONES = [
    { at:0,      name:'🎯 নতুন স্পিনার' },
    { at:100,    name:'🥉 ব্রোঞ্জ স্পিনার' },
    { at:500,    name:'🥈 সিলভার স্পিনার' },
    { at:1000,   name:'🥇 গোল্ড স্পিনার' },
    { at:5000,   name:'💎 ডায়মন্ড স্পিনার' },
    { at:10000,  name:'👑 কিং অফ স্পিন' },
  ];

  // ---------- Wheel segments (১২ ঘর, শুধু ইমোজি + সংখ্যা) ----------
  const segments = [
    { label:'🪙 5',   value:5,   color:'#E8B444' },
    { label:'😢 0',   value:0,   color:'#3A356F' },
    { label:'🍀 10',  value:10,  color:'#2BD9C9' },
    { label:'✨ 15',  value:15,  color:'#F472B6' },
    { label:'⭐ 20',  value:20,  color:'#8B7CF6' },
    { label:'🔥 25',  value:25,  color:'#FF9F43' },
    { label:'🎁 30',  value:30,  color:'#4ADE80' },
    { label:'🎯 40',  value:40,  color:'#22D3EE' },
    { label:'🎉 50',  value:50,  color:'#FF6F91' },
    { label:'👑 75',  value:75,  color:'#60A5FA' },
    { label:'💎 100', value:100, color:'#FFD84D' },
    { label:'🎊 200', value:200, color:'#FF6B6B' },
  ];

  function buildWheel(){
    const svg = document.getElementById('wheel');
    const n = segments.length;
    const cx=100, cy=100, r=98;
    let html = '';
    for(let i=0;i<n;i++){
      const start = (360/n)*i;
      const end = start + 360/n;
      const p1 = polar(cx,cy,r,start);
      const p2 = polar(cx,cy,r,end);
      const large = (end-start) > 180 ? 1 : 0;
      html += `<path d="M${cx},${cy} L${p1.x},${p1.y} A${r},${r} 0 ${large} 1 ${p2.x},${p2.y} Z" fill="${segments[i].color}" stroke="#12102B" stroke-width="2"/>`;
      const mid = start + (360/n)/2;
      const tp = polar(cx,cy,r*0.68,mid);
      html += `<text x="${tp.x}" y="${tp.y}" fill="#12102B" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" transform="rotate(${mid+90},${tp.x},${tp.y})">${segments[i].label}</text>`;
    }
    svg.innerHTML = html;
  }
  function polar(cx,cy,r,deg){
    const rad = (deg-90) * Math.PI/180;
    return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
  }

  // ---------- State helpers ----------
  function getBalance(){ return parseInt(localStorage.getItem(K_BAL) || '0', 10); }
  function setBalance(v){ localStorage.setItem(K_BAL, String(v)); document.getElementById('balanceNum').textContent = v; }
  function getHistory(){ try{ return JSON.parse(localStorage.getItem(K_HIST) || '[]'); }catch(e){ return []; } }
  function pushHistory(entry){
    const h = getHistory();
    h.unshift(entry);
    localStorage.setItem(K_HIST, JSON.stringify(h.slice(0,8)));
    renderHistory();
  }
  function renderHistory(){
    const list = document.getElementById('historyList');
    const h = getHistory();
    if(h.length===0){ list.innerHTML = '<div class="history-item"><span>এখনো কোনো স্পিন হয়নি</span><span></span></div>'; return; }
    list.innerHTML = h.map(item => `<div class="history-item"><span>${item.date}</span><span>+${item.value}</span></div>`).join('');
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---------- Celebration confetti ----------
  function fireConfetti(big){
    const emojis = big ? ['💎','🎉','⭐','✨','🏆'] : ['🎉','✨','🪙'];
    const count = big ? 22 : 12;
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 80 + Math.random()*140;
      el.style.setProperty('--tx', `${Math.cos(angle)*dist}px`);
      el.style.setProperty('--ty', `${Math.sin(angle)*dist - 40}px`);
      el.style.setProperty('--rot', `${(Math.random()*360)-180}deg`);
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1200);
    }
  }

  // ---------- Streak logic ----------
  function todayStr(){ return new Date().toISOString().slice(0,10); } // YYYY-MM-DD
  function updateStreakOnFreeSpin(){
    const today = todayStr();
    const lastDate = localStorage.getItem(K_STREAK_DATE);
    let streak = parseInt(localStorage.getItem(K_STREAK) || '0', 10);
    if(lastDate === today){ /* আজকেরটা আগেই গোনা হয়েছে */ }
    else {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      streak = (lastDate === yesterday) ? streak + 1 : 1;
      localStorage.setItem(K_STREAK, String(streak));
      localStorage.setItem(K_STREAK_DATE, today);
    }
    renderStreak();
  }
  function renderStreak(){
    const today = todayStr();
    const lastDate = localStorage.getItem(K_STREAK_DATE);
    let streak = parseInt(localStorage.getItem(K_STREAK) || '0', 10);
    // যদি গতকালও স্পিন না হয়ে থাকে (এক দিনের বেশি gap), streak ভেঙে দেখাও
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    if(lastDate && lastDate !== today && lastDate !== yesterday){ streak = 0; }
    document.getElementById('streakBadge').textContent = `🔥 ${streak} দিন স্ট্রিক`;
  }

  // ---------- Daily goal logic ----------
  function addDailyPoints(pts){
    const today = todayStr();
    const savedDate = localStorage.getItem(K_DAILY_DATE);
    let current = (savedDate === today) ? parseInt(localStorage.getItem(K_DAILY_PTS) || '0', 10) : 0;
    current += pts;
    localStorage.setItem(K_DAILY_PTS, String(current));
    localStorage.setItem(K_DAILY_DATE, today);
    renderGoal(current);
  }
  function renderGoal(current){
    if(current === undefined){
      const today = todayStr();
      const savedDate = localStorage.getItem(K_DAILY_DATE);
      current = (savedDate === today) ? parseInt(localStorage.getItem(K_DAILY_PTS) || '0', 10) : 0;
    }
    const pct = Math.min(100, Math.round((current / DAILY_GOAL) * 100));
    document.getElementById('goalFill').style.width = pct + '%';
    document.getElementById('goalText').textContent = `${Math.min(current, DAILY_GOAL)} / ${DAILY_GOAL}`;
    if(current >= DAILY_GOAL){
      document.getElementById('goalText').textContent = `✅ আজকের লক্ষ্য পূরণ!`;
    }
  }

  // ---------- Milestone badges ----------
  function getLifetime(){ return parseInt(localStorage.getItem(K_LIFETIME) || '0', 10); }
  function addLifetime(pts){
    const before = getLifetime();
    const after = before + pts;
    localStorage.setItem(K_LIFETIME, String(after));
    const beforeBadge = currentMilestone(before);
    const afterBadge = currentMilestone(after);
    renderBadge(after);
    if(afterBadge.name !== beforeBadge.name){
      showToast(`🏆 নতুন ব্যাজ আনলক: ${afterBadge.name}`);
    }
  }
  function currentMilestone(total){
    let cur = MILESTONES[0];
    for(const m of MILESTONES){ if(total >= m.at) cur = m; }
    return cur;
  }
  function renderBadge(total){
    if(total === undefined) total = getLifetime();
    const cur = currentMilestone(total);
    document.getElementById('badgePill').textContent = cur.name;
    const idx = MILESTONES.indexOf(cur);
    const next = MILESTONES[idx+1];
    document.getElementById('nextBadgeText').textContent = next
      ? `পরের ব্যাজ: ${next.name} (${next.at} পয়েন্টে)`
      : 'সর্বোচ্চ ব্যাজ অর্জিত!';
  }

  // ---------- Spin logic ----------
  let currentRotation = 0;
  let spinning = false;

  function winMessage(won){
    if(won === 0) return '😢 এবার কিছুই আসেনি, আবার চেষ্টা করুন!';
    if(won >= 200) return `🎊 মেগা জ্যাকপট!! ${won} পয়েন্ট!! আপনার আজকের দিনটাই সেরা! 🏆`;
    if(won >= 100) return `💎 জ্যাকপট!! আপনি ${won} পয়েন্ট জিতেছেন!! 🏆`;
    if(won >= 50)  return `🎉 দারুণ জিত! ${won} পয়েন্ট আপনার হয়ে গেছে!`;
    if(won >= 20)  return `⭐ চমৎকার! ${won} পয়েন্ট জিতেছেন!`;
    return `🪙 আপনি ${won} পয়েন্ট জিতেছেন!`;
  }

  function timeLeftText(){
    const last = parseInt(localStorage.getItem(K_LAST) || '0', 10);
    const remain = SPIN_COOLDOWN_MS - (Date.now() - last);
    if(remain <= 0) return null;
    const h = Math.floor(remain/3600000);
    const m = Math.floor((remain%3600000)/60000);
    return `পরের ফ্রি স্পিন: ${h} ঘণ্টা ${m} মিনিট পর`;
  }

  function refreshSpinAvailability(){
    const btn = document.getElementById('spinBtn');
    const timerEl = document.getElementById('timerText');
    const msg = timeLeftText();
    if(msg){
      btn.disabled = true;
      timerEl.textContent = msg;
    } else {
      btn.disabled = false;
      timerEl.textContent = 'আজকের ফ্রি স্পিন রেডি আছে ✅';
    }
  }

  function doSpin(bonus){
    if(spinning) return;
    if(!bonus){
      const msg = timeLeftText();
      if(msg){ showToast('আজকের ফ্রি স্পিন শেষ! বিজ্ঞাপন দেখে এক্সট্রা স্পিন নিন।'); return; }
    }
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    const n = segments.length;
    const winIndex = Math.floor(Math.random()*n);
    const segAngle = 360/n;
    const targetCenter = winIndex*segAngle + segAngle/2;
    // rotate so pointer (top) lands on the chosen segment, plus extra spins
    const extraSpins = 5*360;
    const finalRotation = currentRotation + extraSpins + (360 - targetCenter);
    currentRotation = finalRotation;

    const wheelEl = document.getElementById('wheel');
    wheelEl.style.transform = `rotate(${finalRotation}deg)`;

    setTimeout(()=>{
      const won = segments[winIndex].value;
      setBalance(getBalance() + won);
      addDailyPoints(won);
      addLifetime(won);
      pushHistory({ date: new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'}), value: won });
      showToast(winMessage(won));
      if(won >= 200){ fireConfetti(true); fireConfetti(true); }
      else if(won >= 100){ fireConfetti(true); }
      else if(won > 0){ fireConfetti(false); }
      if(!bonus){
        localStorage.setItem(K_LAST, String(Date.now()));
        updateStreakOnFreeSpin();
      }
      spinning = false;
      refreshSpinAvailability();
    }, 4600);
  }

  // ---------- Monetag rewarded ad hook ----------
  // Monetag থেকে পাওয়া "Rewarded Interstitial" ফাংশনটি এখানে কল করুন।
  // সাধারণত Monetag SDK একটি ফাংশন দেয়, যেমন: show_XXXXXXX()
  // সেটি একটি Promise রিটার্ন করে যা অ্যাড শেষ হলে resolve হয়।
  function showRewardedAd(){
    return new Promise((resolve) => {
      if (typeof window.show_11348987 === 'function') {
        // Monetag Rewarded Interstitial — Zone 11348987
        window.show_11348987().then(resolve).catch(resolve);
      } else {
        // ডেমো/টেস্ট মোড — আসল অ্যাড কোড বসানোর আগে এটা শুধু সিমুলেট করে
        showToast('⏳ বিজ্ঞাপন দেখানো হচ্ছে... (ডেমো মোড)');
        setTimeout(resolve, 1500);
      }
    });
  }

  document.getElementById('adBtn').addEventListener('click', async () => {
    if(spinning) return;
    document.getElementById('adBtn').disabled = true;
    await showRewardedAd();
    document.getElementById('adBtn').disabled = false;
    doSpin(true); // bonus spin, doesn't touch the 24h cooldown
  });

  document.getElementById('spinBtn').addEventListener('click', () => doSpin(false));

  // ---------- Monetag In-App Interstitial (automatic background ads) ----------
  // Zone 11348987 — একই zone, কিন্তু আলাদা মোডে কল করা হচ্ছে যাতে
  // ইউজারকে কিছু না করেও নির্দিষ্ট বিরতিতে অ্যাড স্বয়ংক্রিয়ভাবে দেখায়।
  function startInAppAds(){
    if (typeof window.show_11348987 === 'function') {
      window.show_11348987({
        type: 'inApp',
        inAppSettings: {
          frequency: 2,
          capping: 0.1,
          interval: 30,
          timeout: 5,
          everyPage: false
        }
      });
    }
  }

  // ---------- Social proof (honest, non-fabricated messaging) ----------
  // সতর্কতা: এখানে ইচ্ছাকৃতভাবে কোনো একটা নির্দিষ্ট মিথ্যা সংখ্যা (যেমন "১,২৪০ জন") দেখানো হচ্ছে না,
  // কারণ সেটা বানোয়াট ডেটা এবং প্রতারণামূলক (dark pattern)। ভবিষ্যতে ব্যাকএন্ড/ডেটাবেজ যোগ করলে
  // এখানে real ইউজার-কাউন্ট দেখানো যাবে। আপাতত সাধারণ, সৎ উৎসাহমূলক বার্তা ঘুরিয়ে দেখানো হচ্ছে।
  const socialMessages = [
    'আজ অনেকেই স্পিন করে পয়েন্ট জিতেছেন',
    'প্রতিদিন ফিরে আসুন, স্ট্রিক ধরে রাখুন',
    'বিজ্ঞাপন দেখে বোনাস স্পিন নিতে ভুলবেন না',
  ];
  let socialIdx = 0;
  function rotateSocialProof(){
    document.getElementById('socialProofText').textContent = socialMessages[socialIdx % socialMessages.length];
    socialIdx++;
  }
  // ---------- Init ----------
  buildWheel();
  setBalance(getBalance());
  renderHistory();
  renderStreak();
  renderGoal();
  renderBadge();
  rotateSocialProof();
  setInterval(rotateSocialProof, 6000);
  refreshSpinAvailability();
  setInterval(refreshSpinAvailability, 30000);
  startInAppAds();
</script>
</body>
</html>
